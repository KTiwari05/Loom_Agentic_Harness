[project]
name = "loom-agent"
version = "0.1.0"
description = "An open, glass-box coding agent that routes cheap open-source models into reliable engineering work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
desktop = [
    "pywebview>=5.0",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
loom = "loom.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
